<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LH Games - login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <header>
        

        <nav class="navbar navbar-expand-lg bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img src="img/logo.png" alt="Logo LH Games">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#">Promoções</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Console</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Jogos</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="O que deseja buscar?" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Buscar</button>
          </form>
        </div>
      </div>
    </nav>

    </header>

    
        <main class="container">
    <!-- Secção de Login -->
    <section id="section-login" class="mx-auto" style="max-width: 400px;">
      <h1>Login</h1>
      <form>
        <div class="mb-3">
          <label for="usuario" class="form-label">Nome:</label>
          <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Insira o seu usuário">
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha:</label>
          <input type="password" name="senha" id="senha" class="form-control" placeholder="Insira a sua senha">
        </div>
        <div class="d-grid mb-3">
          <input type="button" value="login" class="btn btn-primary" id="bt-login" onclick="login()">
        </div>
      </form>

        </section>

        <section id="section-cadastro">
      <div id="botao-cadastrar" class="text-center">
        <button type="button" class="btn btn-info text-white">Não é cadastrado ainda? Cadastre-se</button>
      </div>

      <!-- Formulário de Cadastro (Oculto inicialmente via CSS) -->
      <div id="form-cadastrar" class="mx-auto" style="max-width: 450px;">
        <h2>Criar minha conta</h2>
        <p>Informe os seus dados abaixo para criar sua conta.</p>
        <form>
          <div class="mb-3 text-start">
            <label class="form-label">Usuário:</label>
            <input type="text" class="form-control" placeholder="ex. nome de usuário">
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">E-mail:</label>
            <input type="email" class="form-control" placeholder="seu@email.com.br">
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">Senha:</label>
            <input type="password" class="form-control" placeholder="mínimo de 6 caracteres">
          </div>
          <div class="d-grid">
            <input type="button" value="Cadastrar" class="btn btn-primary" id="bt-cadastrar" onclick="cadastro()">
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Botão de Voltar ao Topo -->
  <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">&uarr; Voltar ao topo</button>

    </main>



    <footer>
        <p>Desenvolvimento por LH Games</p>
    </footer>

    <button id="voltar-topo" type="button" class="btn btn-outline-primary">&uarr; Voltar ao topo</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.1.js"
        integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/jquery-script.js"></script>

</body>

</html>
